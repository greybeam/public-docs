    (function () {
      const { span, between, sec, EASE_IN_OUT, EASE_OUT } = window.GB;
      const tl = gsap.timeline({ paused: true });

      const C = {
        border: "#2B2925",
        amber: "#FA9F42",
        neutralHi: "#D4D4D4", // centre card, client and engine highlights
        nodeIdle: "#57534C",
        blueDim: "#4E7492",
        amberDim: "#563B1E",
        codeAccent: "#FA9F42",
        strong: "#FFFFF0",
        emphasis: "#E5E5E5",
        body: "#A0A0A0",
        biMarker: "#FA9F42",
        appMarker: "#D4D4D4",
        error: "#F06A5F",
        blue: "#77B6EA",
        blueSynced: "#689AC3", // border mixed 80% toward blue
      };

      // Wire endpoints (cubic S-curves whose control points sit at the horizontal midpoint).
      const PATHS = {
        bi: [500, 360, 750, 484],
        dbt: [500, 520, 750, 520],
        python: [500, 680, 750, 556],
        duckdb: [1170, 484, 1340, 372],
        snowflake: [1170, 556, 1340, 668],
      };
      // Position along such a curve at eased parameter s, split per axis so each axis is a
      // plain GSAP tween with its own ease (no update callbacks needed).
      const alongX = (s) => 1.5 * s - 1.5 * s * s + s * s * s;
      const alongY = (s) => 3 * s * s - 2 * s * s * s;

      // ---- The story: three queries (frame numbers at 30 fps) ----
      const directQuery = (id, s, client, engine, color) => ({
        id, s, client, color, end: s + 112, logAt: s + 106,
        legs: [
          [client, false, s + 4, s + 26],
          [engine, false, s + 48, s + 66],
          [engine, true, s + 78, s + 92],
          [client, true, s + 92, s + 110],
        ],
        inspections: [[s + 26, s + 66]],
        runs: [{ engine, a: s + 66, b: s + 78, fails: false }],
      });
      const fallbackQuery = (id, s, client, color) => ({
        id, s, client, color, end: s + 176, logAt: s + 170,
        legs: [
          [client, false, s + 4, s + 26],
          ["duckdb", false, s + 48, s + 66],
          ["duckdb", true, s + 86, s + 100],
          ["snowflake", false, s + 112, s + 130],
          ["snowflake", true, s + 142, s + 156],
          [client, true, s + 156, s + 174],
        ],
        inspections: [[s + 26, s + 66], [s + 98, s + 130]],
        runs: [
          { engine: "duckdb", a: s + 66, b: s + 90, fails: true },
          { engine: "snowflake", a: s + 130, b: s + 142, fails: false },
        ],
      });
      const QUERIES = [
        directQuery("q1", 100, "bi", "duckdb", C.biMarker), // 100 · No issues
        directQuery("q2", 215, "python", "snowflake", C.appMarker), // 204 · DML query
        fallbackQuery("q3", 330, "bi", C.biMarker), // 800 · DuckDB query failed
      ];
      const HYDRATION = [500, 575];
      const CODES = [585, 645];
      const OUTRO = [632, 655];

      // ---- Static setup: path lengths for stroke-dash drawing, chip start positions ----
      const lengthOf = (el) => el.getTotalLength();
      document.querySelectorAll("path.trail").forEach((el) => {
        const len = lengthOf(el);
        el.setAttribute("stroke-dasharray", `${len} ${len}`);
        el.setAttribute("stroke-dashoffset", `${len}`);
        el.dataset.len = String(len);
      });
      document.querySelectorAll("path.pulse").forEach((el) => {
        const len = lengthOf(el);
        el.setAttribute("stroke-dasharray", `140 ${len + 140}`);
        el.setAttribute("stroke-dashoffset", "140");
        el.dataset.len = String(len);
      });

      // ---- Intro: endpoint swap, pulses from every client ----
      between(tl, "#ghost-host", 6, 92, 10, 14, { opacity: 0 }, { opacity: 0.9 });
      span(tl, "#ghost-strike", 20, 36, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, transformOrigin: "0% 50%" }, "none");
      between(tl, "#endpoint", 26, 96, 12, 14, { borderColor: C.amberDim, color: C.emphasis }, { borderColor: C.amber, color: C.strong });
      between(tl, "#endpoint-stem", 26, 96, 12, 14, { backgroundColor: C.amberDim }, { backgroundColor: C.amber });
      ["bi", "dbt", "python"].forEach((id, i) => {
        const el = document.getElementById("pulse-" + id);
        const start = 12 + i * 8;
        span(tl, el, start, start + 34, { attr: { "stroke-dashoffset": 140 } }, { attr: { "stroke-dashoffset": -Number(el.dataset.len) } });
      });

      // ---- Greybeam card: neutral border + soft glow while inspecting; scan sweep ----
      const inspectOn = { borderColor: C.neutralHi, boxShadow: "0px 0px 28px 0px rgba(212, 212, 212, 0.16)" };
      const inspectOff = { borderColor: C.nodeIdle, boxShadow: "0px 0px 28px 0px rgba(212, 212, 212, 0)" };
      between(tl, "#gb-node", 40, 96, 10, 12, inspectOff, inspectOn);
      const scanHalfIn = (u) => Math.sin(Math.PI * EASE_IN_OUT(u / 2));
      const scanHalfOut = (u) => 1 - Math.sin(Math.PI * EASE_IN_OUT(0.5 + u / 2));
      QUERIES.flatMap((q) => q.inspections).forEach(([a, b], i) => {
        between(tl, "#gb-node", a, b - 18, 6, 10, inspectOff, inspectOn);
        span(tl, "#gb-scan", a, a + 20, { x: 0 }, { x: 540 });
        span(tl, "#gb-scan", a, a + 10, { opacity: 0 }, { opacity: 0.9 }, scanHalfIn);
        span(tl, "#gb-scan", a + 10, a + 20, { opacity: 0.9 }, { opacity: 0 }, scanHalfOut);
        between(tl, `#verdict-${i}`, a + 8, b + 6, 8, 8, { opacity: 0 }, { opacity: 1 });
      });

      // ---- Queries: client highlight, trails, chips, engine runs, log rows ----
      for (const q of QUERIES) {
        between(tl, `#client-${q.client}`, q.s, q.end + 12, 8, 12, { borderColor: C.border }, { borderColor: C.neutralHi });

        const failRun = q.runs.find((r) => r.fails);
        const failAt = failRun ? failRun.a + 10 : null;

        q.legs.forEach(([path, reversed, a, b], i) => {
          // Chip: travels the wire with an in-out ease, fading at both ends.
          const chip = document.getElementById(q.id + "-c" + i);
          const [x0, y0, x1, y1] = PATHS[path];
          const [fx, fy, tx, ty] = reversed ? [x1, y1, x0, y0] : [x0, y0, x1, y1];
          const w = chip.classList.contains("query") ? 150 : 80;
          chip.style.left = `${fx - w / 2}px`;
          chip.style.top = `${fy - 27}px`;
          span(tl, chip, a, b, { x: 0 }, { x: tx - fx }, (t) => alongX(EASE_IN_OUT(t)));
          span(tl, chip, a, b, { y: 0 }, { y: ty - fy }, (t) => alongY(EASE_IN_OUT(t)));
          const edge = (b - a) * 0.12;
          span(tl, chip, a, a + edge, { opacity: 0 }, { opacity: 1 });
          span(tl, chip, b - edge, b, { opacity: 1 }, { opacity: 0 });

          // Trail: the outbound wire draws in behind the chip and stays lit until the query ends.
          if (reversed) return;
          const trail = document.getElementById(q.id + "-t" + i);
          const len = Number(trail.dataset.len);
          span(tl, trail, a, b, { attr: { "stroke-dashoffset": len } }, { attr: { "stroke-dashoffset": 0 } });
          const failed = failAt !== null && path === "duckdb";
          span(tl, trail, a, a + 1, { opacity: 0 }, { opacity: 1 }, EASE_OUT);
          if (failed) {
            span(tl, trail, failAt, failAt + 8, { stroke: q.color, opacity: 1 }, { stroke: C.error, opacity: 0.55 });
          }
          span(tl, trail, q.end, q.end + 14, { opacity: failed ? 0.55 : 1 }, { opacity: 0 });
        });

        for (const run of q.runs) {
          const card = `#engine-${run.engine}`;
          const bar = `#bar-${run.engine}`;
          if (!run.fails) {
            between(tl, card, run.a, run.b + 14, 6, 12, { borderColor: C.border }, { borderColor: C.neutralHi });
            between(tl, bar, run.a, run.b + 14, 6, 12, { opacity: 0 }, { opacity: 1 });
            span(tl, bar, run.a, run.b, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, transformOrigin: "0% 50%" });
            continue;
          }
          const end = run.b + 16;
          span(tl, card, run.a, run.a + 6, { borderColor: C.border }, { borderColor: C.neutralHi }, EASE_OUT);
          span(tl, card, failAt, failAt + 4, { borderColor: C.neutralHi }, { borderColor: C.error }, EASE_OUT);
          span(tl, card, end - 14, end, { borderColor: C.error }, { borderColor: C.border });
          between(tl, bar, run.a, end, 6, 14, { opacity: 0 }, { opacity: 1 });
          span(tl, bar, run.a, failAt, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 0.6, transformOrigin: "0% 50%" });
          span(tl, bar, failAt, failAt + 4, { backgroundColor: C.amber }, { backgroundColor: C.error }, EASE_OUT);
          between(tl, "#duck-error", failAt, end, 4, 14, { opacity: 0 }, { opacity: 1 });
        }

        const row = `#row-${q.id}`;
        span(tl, row, q.logAt, q.logAt + 12, { opacity: 0 }, { opacity: 1 }, EASE_OUT);
        span(tl, row, q.logAt, q.logAt + 16, { y: 16 }, { y: 0 }, EASE_OUT);
        span(tl, row, OUTRO[0], OUTRO[1], { opacity: 1 }, { opacity: 0 });
      }

      // ---- Hydration: dashes flow Snowflake → Your S3 → DuckDB; blue focus, tables pass through S3 ----
      // Dash period 20 px divides the 660-frame loop, so the flow lines up at the seam.
      tl.fromTo("#hyd-line", { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": -660 }, duration: sec(660), ease: "none", immediateRender: false }, 0);
      const [h0, h1] = HYDRATION;
      between(tl, "#hyd-line", h0, h1, 12, 12, { stroke: C.blueDim, opacity: 0.75 }, { stroke: C.blue, opacity: 1 });
      between(tl, "#hyd-arrow", h0, h1, 12, 12, { stroke: C.blueDim }, { stroke: C.blue });
      between(tl, ".hyd-label", h0, h1, 12, 12, { color: C.body }, { color: C.blue });
      between(tl, "#s3-node", h0, h1, 12, 12, { borderColor: "#3A3632" }, { borderColor: C.blueSynced });
      between(tl, "#engine-duckdb", h0, h1, 12, 12, { borderColor: C.border }, { borderColor: C.blueSynced });
      [0, 1, 2].forEach((i) => {
        const start = 506 + i * 18;
        span(tl, `#hyd-b${i}`, start, start + 34, { attr: { y: 587 } }, { attr: { y: 447 } });
        between(tl, `#hyd-b${i}`, start, start + 34, 6, 8, { opacity: 0 }, { opacity: 1 });
      });

      // ---- Routing codes: frame the code column, dim everything else ----
      between(tl, "#code-frame", CODES[0], CODES[1], 12, 12, { opacity: 0 }, { opacity: 1 });
      between(tl, "#head-code", CODES[0], CODES[1], 12, 12, { color: C.body }, { color: C.codeAccent });

      // ---- Focus dimming (opacity multiplier for parts not in focus) ----
      const dimHydration = ["#dg-clients", "#dg-greybeam", "#dg-log", "#wires-clients", "#wires-flow"];
      const dimCodes = ["#dg-clients", "#dg-greybeam", "#dg-engines", "#wires-clients", "#wires-engines", "#wires-flow"];
      between(tl, dimHydration, h0, h1, 12, 12, { opacity: 1 }, { opacity: 0.4 });
      between(tl, dimCodes, CODES[0], OUTRO[1], 12, 18, { opacity: 1 }, { opacity: 0.4 });

      window.__timelines["diagram"] = tl;
    })();
  </script>
</template>
