<!doctype html>
<!--
  "How Greybeam works": a seamless 22 s loop for the docs Introduction page.
  Frame 0 and the last frame show the same idle diagram, so playback loops without a seam.
  The diagram (cards, connectors, query chips, query log) is compositions/diagram.html;
  the step titles are compositions/titles.html.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="lib/anim.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=TASA+Orbiter:wght@500;600&family=Geist+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #10100E;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      /* Dot grid on the brand background. 48 px pitch, offset by half a cell. */
      #backdrop {
        position: absolute;
        inset: 0;
        background-color: #10100E;
        background-image: radial-gradient(#221F1A 2px, transparent 2px);
        background-size: 48px 48px;
        background-position: 24px 24px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="22"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="backdrop"></div>
      <div
        id="diagram"
        data-composition-id="diagram"
        data-composition-src="compositions/diagram.html"
        data-start="0"
        data-duration="22"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="titles"
        data-composition-id="titles"
        data-composition-src="compositions/titles.html"
        data-start="0"
        data-duration="22"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
